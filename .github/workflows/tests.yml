name: Synthetic motion tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1
      - run: python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python examples/generate.py demo_input
      - run: python solver.py solve demo_input/keys.json demo_input/body.json demo_input/reference.json demo_output --iterations 120
      - run: python solver.py analyze demo_output/solved.json demo_input/body.json analysis.json
      - run: python examples/contact_benchmark.py contact_benchmark.json
      - run: python examples/joint_benchmark.py joint_benchmark.json
      - run: python examples/collision_benchmark.py collision_benchmark.json
      - run: python examples/coupled_benchmark.py coupled_benchmark.json
      - run: python examples/tracking_benchmark.py tracking_benchmark.json
      - run: python examples/support_benchmark.py support_benchmark.json
      - run: python examples/impact_benchmark.py impact_benchmark.json
      - run: python examples/multi_contact_benchmark.py multi_contact_benchmark.json
      - run: python examples/horizon_benchmark.py horizon_benchmark.json
